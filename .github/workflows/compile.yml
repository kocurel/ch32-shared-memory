name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install RISC-V Toolchain via APT
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-riscv64-unknown-elf libnewlib-dev

    - name: Build firmware with Make
      run: |
        cd source
        make
