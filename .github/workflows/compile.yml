
name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install xPack RISC-V GCC
      uses: xpack-dev-tools/setup-riscv-none-elf-gcc-action@v2
      with:
        version: '15.2.0-1.1'

    - name: Build firmware with Make
      run: |
        cd source 
        make

      
